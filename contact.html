<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Grace Design and Construction Company | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="contact-page">
    <header class="page-banner">
        <nav class="inner-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact us</a></li>
                <li><a href="service.html">Our Services</a></li>
                <li><a href="projects.html">Projects</a></li>
                
            </ul>
        </nav>

        <div class="banner-overlay">
            <p class="banner-tag">GDCT</p>
            <h1>Contact Us</h1>
        </div>
    </header>

    <main class="contact-main">
        <section class="contact-layout">
            <div class="contact-form-box">
                <h2>Let's build something divine</h2>
                <form class="contact-form">
                    <div class="field">
                        <label for="name">Name</label>
                        <input id="name" type="text" name="name">
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" type="email" name="email">
                    </div>

                    <div class="field">
                        <label for="phone">Phone</label>
                        <input id="phone" type="tel" name="phone">
                    </div>

                    <div class="field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message"></textarea>
                    </div>

                    <button type="submit" class="send-btn">Send</button>
                </form>
            </div>

            <aside class="contact-info-box">
                <h3>Contact Details</h3>

                <div class="info-item">
                    <span>Phone</span>
                    <p>+231 770519557</p>
                    <p>+231 886345436</p>
                </div>

                <div class="info-item">
                    <span>Email</span>
                    <p>favouragu285@gmail.com</p>
                </div>

                <div class="contact-badge">Certified Liberian Contractor</div>
            </aside>
        </section>
    </main>

    <footer class="page-footer">
        2026 Grace Construction | brought to you by E-Favour Tech Marketting
    </footer>
</body>
</html>
